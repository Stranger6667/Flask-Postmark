[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Flask-Postmark"
dynamic = ["version"]
description = "Postmark Flask extension"
keywords = ["flask", "postmark", "email"]
authors = [{ name = "Dmitry Dygalo", email = "dmitry@dygalo.dev" }]
maintainers = [{ name = "Dmitry Dygalo", email = "dmitry@dygalo.dev" }]
readme = "README.rst"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Communications :: Email",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["Flask", "postmarker>=0.11.2"]

[project.optional-dependencies]
tests = ["coverage[toml]>=7.2", "pytest>=8"]

[project.urls]
Changelog = "https://github.com/Stranger6667/Flask-Postmark/blob/master/docs/changelog.rst"
"Bug Tracker" = "https://github.com/Stranger6667/Flask-Postmark/issues"
Funding = "https://github.com/sponsors/Stranger6667"
"Source Code" = "https://github.com/Stranger6667/Flask-Postmark"

[tool.hatch.version]
path = "src/flask_postmark/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/test"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
testpaths = ["test"]

[tool.coverage.run]
parallel = true
branch = true
source_pkgs = ["flask_postmark"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages", ".tox/*/lib/*/site-packages", ".tox/*/Lib/site-packages"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100

[tool.black]
line-length = 120
target_version = ["py311"]

[tool.isort]
line_length = 120
multi_line_output = 3
default_section = "THIRDPARTY"
include_trailing_comma = true
known_first_party = "flask_postmark"
known_third_party = ["flask", "flask_postmark", "postmarker", "pytest"]
